<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Bank v17 - With Bank Selector</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0d0d0d;color:#fff;padding-bottom:80px}
.top-gold{margin:10px;background:linear-gradient(90deg,#ffcc00,#ff9900);border-radius:16px;padding:12px;display:flex;gap:8px;color:#000;font-size:12px;font-weight:bold}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.act{background:#1e1e1e;border-radius:12px;padding:12px;text-align:center;cursor:pointer;border:1px solid #222}
.act span{font-size:10px;display:block;margin-top:4px}
.transfer-box{margin:10px;background:#111;border-radius:14px;padding:14px}
.transfer-box h3{font-size:13px;margin-bottom:10px}
.transfer-box select, .transfer-box input{width:100%;padding:14px;margin-bottom:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px;outline:none}
.transfer-box select{border-color:#d4af37}
.send-btn{width:100%;padding:14px;background:linear-gradient(90deg,#ffcc00,#ff9900);border:none;border-radius:10px;font-weight:900;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #222}
.nav{font-size:9px;text-align:center;color:#777}
.nav.active{color:#ffcc00}
</style>
</head>
<body>

<div class="top-gold">
  <div style="background:#000;color:#ffcc00;padding:5px 10px;border-radius:20px">Freeze</div>
  <div style="background:#000;color:#fff;padding:5px 10px;border-radius:20px">+ Add Money</div>
</div>

<div class="actions">
  <div class="act" onclick="document.getElementById('transfer').scrollIntoView({behavior:'smooth'})"><div>💸</div><span>Transfer</span></div>
  <div class="act"><div>📱</div><span>Airtime</span></div>
  <div class="act"><div>💡</div><span>Bills</span></div>
  <div class="act"><div>📄</div><span>History</span></div>
</div>

<div id="transfer" class="transfer-box">
  <h3>Transfer</h3>
  
  <!-- BANK SELECTOR - THIS WAS MISSING -->
  <select id="bankSelect">
    <option value="">-- Select Bank --</option>
    <option value="Access Bank">Access Bank</option>
    <option value="GTBank">GTBank (Guaranty Trust)</option>
    <option value="First Bank">First Bank of Nigeria</option>
    <option value="UBA">UBA - United Bank for Africa</option>
    <option value="Zenith Bank">Zenith Bank</option>
    <option value="Union Bank">Union Bank</option>
    <option value="Wema Bank">Wema Bank</option>
    <option value="Fidelity Bank">Fidelity Bank</option>
    <option value="FCMB">FCMB</option>
    <option value="Ecobank">Ecobank</option>
    <option value="Sterling Bank">Sterling Bank</option>
    <option value="OPay">OPay</option>
    <option value="Moniepoint">Moniepoint</option>
    <option value="Kuda">Kuda Microfinance</option>
    <option value="PalmPay">PalmPay</option>
  </select>

  <input id="account" type="number" placeholder="10-digit account" maxlength="10" oninput="if(this.value.length>10)this.value=this.value.slice(0,10)">
  <input id="amount" type="number" placeholder="Amount">
  <input id="remark" type="text" placeholder="Remark">
  
  <button class="send-btn" onclick="sendMoney()">Send Now</button>
  
  <div style="margin-top:10px;font-size:10px;color:#888">Balance: <span id="balText">₦125,000.00</span> • Fee: ₦0</div>
</div>

<div class="bottom-nav">
  <div class="nav active">🏠<br>Home</div>
  <div class="nav">💳<br>Card</div>
  <div class="nav">🎁<br>Reward</div>
  <div class="nav">💰<br>Loan</div>
  <div class="nav">👤<br>Profile</div>
</div>

<script>
let balance = 125000;

function sendMoney(){
  const bank = document.getElementById('bankSelect').value;
  const account = document.getElementById('account').value;
  const amount = parseFloat(document.getElementById('amount').value);
  const remark = document.getElementById('remark').value;

  // VALIDATION WITH BANK SELECTOR
  if(!bank){
    alert('Please select bank');
    return;
  }
  if(account.length !== 10){
    alert('Account number must be 10 digits');
    return;
  }
  if(!amount || amount <= 0){
    alert('Enter valid amount');
    return;
  }
  if(amount > balance){
    alert('Insufficient balance. Your balance is ₦' + balance.toLocaleString());
    return;
  }

  // SUCCESS
  balance -= amount;
  document.getElementById('balText').innerText = '₦' + balance.toLocaleString() + '.00';
  
  alert('SUCCESS!\n\nBank: ' + bank + '\nAccount: ' + account + '\nAmount: ₦' + amount.toLocaleString() + '\nRemark: ' + remark);
  
  // Clear form
  document.getElementById('bankSelect').value = '';
  document.getElementById('account').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('remark').value = '';
}
</script>

</body>
</html>
