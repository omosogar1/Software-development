<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Bank App v26.1</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffcc00">
<link rel="icon" href="logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--bg:#0d0d0d;--card:#1c1c1c;--card2:#151515;--text:#fff;--muted:#888;--border:#333;--yellow:#ffcc00}
body{background:var(--bg);color:var(--text)}
#loginScreen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at top,#222,var(--bg))}
.loginBox{width:100%;max-width:380px;background:var(--card2);border:1px solid var(--border);border-radius:22px;padding:28px;text-align:center}
.loginBox img{width:80px;height:80px;border-radius:50%;border:3px solid var(--yellow);background:#000;object-fit:cover}
.loginBox h2{color:var(--yellow);margin-top:10px}
.loginBox p{color:var(--muted);font-size:12px;margin:8px 0}
.loginBox input{width:100%;padding:14px;background:#0d0d0d;border:1px solid var(--border);border-radius:12px;color:#fff;margin-top:12px;outline:none}
.loginBtn{width:100%;padding:14px;background:var(--yellow);border:none;border-radius:12px;font-weight:900;color:#000;cursor:pointer;margin-top:14px;font-size:15px}
.createBtn{width:100%;padding:14px;background:transparent;border:2px solid var(--yellow);border-radius:12px;font-weight:900;color:var(--yellow);cursor:pointer;margin-top:12px;font-size:14px;display:block}
.link{color:#666;font-size:11px;margin-top:12px;display:block}
#appScreen{display:none}
.page{display:none;padding-bottom:90px}.page.active{display:block}
.top{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--yellow)}
.top-left img{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--yellow);background:#000}
.card{margin:12px;background:linear-gradient(135deg,var(--card),#222);border:1px solid var(--border);border-radius:20px;padding:20px}
.card h1{color:var(--yellow);font-size:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.act{background:var(--card2);border-radius:16px;padding:22px;text-align:center;border:1px solid var(--border);cursor:pointer}
.act span{color:var(--yellow);display:block;margin-top:8px;font-size:13px}
.history-wrap{margin:12px;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:12px}
.txn{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.bigBox{margin:12px;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center}
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.90);display:none;justify-content:center;align-items:center;z-index:9999;padding:15px}
.modal{width:100%;max-width:450px;background:#121212;border:2px solid var(--yellow);border-radius:22px;padding:20px;max-height:95vh;overflow:auto}
.modal h3{color:var(--yellow);display:flex;justify-content:space-between;margin-bottom:15px}
.modal input,.modal select{width:100%;padding:14px;background:#000;color:#fff;border:1px solid #333;border-radius:10px;margin-bottom:10px}
.send{width:100%;padding:15px;background:var(--yellow);border:none;border-radius:12px;font-weight:900;font-size:16px;color:#000;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card2);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid var(--border);z-index:20}
.bnav{font-size:10px;color:var(--muted);text-align:center;cursor:pointer;padding:4px 10px;border-radius:10px}
.bnav.active{color:var(--yellow);background:var(--bg)}
</style>
</head>
<body>

<div id="loginScreen">
<div class="loginBox">
<img src="logo.png">
<h2>Kelly Bank v26.1</h2>
<p>Built by Omosogar1 • Secure Banking</p>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button class="loginBtn" onclick="login()">LOGIN</button>
<button type="button" class="createBtn" onclick="openRegister()">🆕 CREATE NEW ACCOUNT</button>
<span class="link">Default: kelly / 1234</span>
</div>
</div>

<div id="appScreen">
<div class="top"><div class="top-left"><img src="logo.png"> Kelly Bank</div><div style="display:flex;gap:12px"><span onclick="logout()" style="color:var(--yellow);font-size:12px;cursor:pointer">Logout</span></div></div>
<div id="page-home" class="page active"><div class="card"><h1 id="mainBal">₦30,075,000.00</h1><p id="welcomeUser">Welcome</p></div><div class="history-wrap"><h3 style="color:var(--yellow)">Transactions</h3><div id="txnList"></div></div></div>
<div id="page-me" class="page"><div class="bigBox"><img src="logo.png" style="width:90px;height:90px;border-radius:50%;border:3px solid var(--yellow)"><h3 id="meName">Kelly</h3><p id="meUser"></p><button class="createBtn" onclick="openRegister()">➕ CREATE NEW ACCOUNT</button><button class="loginBtn" style="background:#222;color:#888;border:1px solid #333;margin-top:10px" onclick="logout()">Logout</button></div></div>
<div class="bottom"><div class="bnav active" onclick="switchPage('home')">🏠<br>Home</div><div class="bnav" onclick="switchPage('me')">👤<br>Me</div></div>
</div>

<!-- REGISTER MODAL - FIXED -->
<div id="modal-register" class="modal-bg"><div class="modal">
<h3>CREATE NEW ACCOUNT <span onclick="closeAll()" style="cursor:pointer">✕</span></h3>
<input id="regFullname" placeholder="Full Name">
<input id="regUsername" placeholder="Username (e.g kelly2)">
<input id="regPhone" placeholder="Phone">
<input id="regPassword" type="password" placeholder="Password min 4">
<button class="send" onclick="registerUser()">🎉 CREATE MY ACCOUNT NOW</button>
</div></div>

<div id="modal-receipt" class="modal-bg"><div class="modal"><div style="background:#fff;color:#000;border-radius:16px;padding:20px"><div id="receiptDetails"></div></div><button class="send" style="margin-top:12px;background:#000;color:#fff" onclick="closeAll()">Close</button></div></div>

<script>
let users=JSON.parse(localStorage.getItem('kb_users')||'null')||[{fullname:'Kelly Osaro',username:'kelly',password:'1234',phone:'08012345678',acct:'3007500001',balance:30075000}];
let currentUser=JSON.parse(localStorage.getItem('kb_current')||'null');
let txns=JSON.parse(localStorage.getItem('kb_txns')||'[]');
let balance=currentUser?currentUser.balance:30075000;

function saveUsers(){localStorage.setItem('kb_users',JSON.stringify(users));}
function saveAll(){localStorage.setItem('kb_txns',JSON.stringify(txns)); if(currentUser){localStorage.setItem('kb_current',JSON.stringify(currentUser)); localStorage.setItem('kb_logged','1');}}
function updateBal(){let el=document.getElementById('mainBal'); if(el) el.innerText='₦'+Number(balance).toLocaleString()+'.00';}
function renderHistory(){let el=document.getElementById('txnList'); if(!el) return; el.innerHTML=txns.length?txns.map((t,i)=>`<div class="txn"><div><b>${t.bank}</b><br><span style="color:#888">${t.acct}</span></div><div>-₦${Number(t.amount).toLocaleString()}</div></div>`).join(''):'<div style="color:#555;padding:10px;text-align:center">No transactions yet</div>';}
function refreshUI(){if(!currentUser)return; document.getElementById('welcomeUser').innerText='Welcome '+currentUser.fullname; document.getElementById('meName').innerText=currentUser.fullname; document.getElementById('meUser').innerText=currentUser.username+' • '+currentUser.acct; balance=currentUser.balance; updateBal();}
function login(){let u=document.getElementById('username').value.trim().toLowerCase(),p=document.getElementById('password').value.trim(); let f=users.find(x=>x.username.toLowerCase()===u && x.password===p); if(f){currentUser=f; document.getElementById('loginScreen').style.display='none'; document.getElementById('appScreen').style.display='block'; refreshUI(); renderHistory(); saveAll();}else{alert('Invalid! Use kelly / 1234 or Create New Account');}}
function openRegister(){console.log('open register clicked'); document.getElementById('modal-register').style.display='flex';}
function closeAll(){document.querySelectorAll('.modal-bg').forEach(m=>m.style.display='none');}
function registerUser(){let fn=document.getElementById('regFullname').value.trim(),un=document.getElementById('regUsername').value.trim().toLowerCase(),ph=document.getElementById('regPhone').value.trim(),pw=document.getElementById('regPassword').value.trim(); if(!fn||!un||!ph||!pw){alert('Fill all fields');return;} if(pw.length<4){alert('Password min 4 chars');return;} if(users.find(x=>x.username.toLowerCase()===un)){alert('Username exists! Choose another');return;} let acct='30075'+Math.floor(10000+Math.random()*90000); let nu={fullname:fn,username:un,password:pw,phone:ph,acct:acct,balance:30075000}; users.push(nu); currentUser=nu; saveUsers(); closeAll(); document.getElementById('loginScreen').style.display='none'; document.getElementById('appScreen').style.display='block'; refreshUI(); renderHistory(); saveAll(); alert('✅ ACCOUNT CREATED!\nUser: '+un+'\nAcct: '+acct+'\nBalance: ₦30,075,000.00\nLogged in now!');}
function logout(){localStorage.removeItem('kb_logged');localStorage.removeItem('kb_current');location.reload();}
function switchPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.page').forEach(p=>{if(p.id==='page-'+n) p.classList.add('active');}); if(n==='home') document.getElementById('page-home').classList.add('active'); if(n==='me') document.getElementById('page-me').classList.add('active');}
if(localStorage.getItem('kb_logged')&&currentUser){document.getElementById('loginScreen').style.display='none'; document.getElementById('appScreen').style.display='block'; refreshUI(); renderHistory();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=26.1');}
</script>
</body>
</html>
