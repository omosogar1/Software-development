<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Bank v20 - Bank Selector Fixed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0d0d0d;color:#fff;padding-bottom:80px}
.transfer-box{margin:15px;background:#151515;border-radius:14px;padding:15px;border:1px solid #222}
.transfer-box h3{color:gold;margin-bottom:12px}
.transfer-box select{width:100%;padding:15px;margin-bottom:12px;background:#000;color:#fff;border:2px solid gold;border-radius:10px;font-size:14px}
.transfer-box input{width:100%;padding:14px;margin-bottom:10px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:10px}
.send-btn{width:100%;padding:15px;background:gold;border:none;border-radius:10px;font-weight:900;cursor:pointer;color:#000;font-size:16px}
</style>
</head>
<body>
<div id="transfer" class="transfer-box">
  <h3>Transfer</h3>
  <select id="bankSelect">
    <option value="">-- Select Bank --</option>
    <option>Access Bank</option><option>GTBank</option><option>First Bank</option>
    <option>UBA</option><option>Zenith Bank</option><option>Union Bank</option>
    <option>Wema Bank</option><option>Fidelity Bank</option><option>FCMB</option>
    <option>Ecobank</option><option>Sterling Bank</option><option>OPay</option>
    <option>Moniepoint</option><option>Kuda</option><option>PalmPay</option>
  </select>
  <input id="account" type="number" placeholder="10-digit account">
  <input id="amount" type="number" placeholder="Amount">
  <input id="remark" type="text" placeholder="Remark">
  <button class="send-btn" onclick="sendMoney()">Send Now</button>
  <div style="margin-top:10px;font-size:11px;color:#aaa">Balance: <span id="balText">₦125,000.00</span></div>
</div>
<script>
let balance=125000;
function sendMoney(){
  const bank=document.getElementById('bankSelect').value;
  const account=document.getElementById('account').value;
  const amount=parseFloat(document.getElementById('amount').value);
  if(!bank){alert('Please select bank');return;}
  if(account.length!=10){alert('Account must be 10 digits');return;}
  if(!amount||amount<=0){alert('Enter amount');return;}
  if(amount>balance){alert('Insufficient balance');return;}
  balance-=amount;
  document.getElementById('balText').innerText='₦'+balance.toLocaleString()+'.00';
  alert('SUCCESS!\nBank: '+bank+'\nAcct: '+account+'\nAmount: ₦'+amount.toLocaleString());
  document.getElementById('bankSelect').value='';document.getElementById('account').value='';document.getElementById('amount').value='';document.getElementById('remark').value='';
}
</script>
</body>
</html>
