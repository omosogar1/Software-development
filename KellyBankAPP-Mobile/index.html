<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KellyBank - Your Money, Your Bank</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6a00">
<link rel="icon" href="logo.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter, sans-serif}
  body{background:#0f0f0f;color:#fff;min-height:100vh;padding:15px}
  .app{max-width:400px;margin:auto;background:#1a1a1a;border-radius:25px;padding:20px;border:1px solid #333}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .logo{width:40px;height:40px;background:#ff6a00;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
  .balance-card{background:linear-gradient(135deg,#ff6a00,#ff8c42);border-radius:20px;padding:20px;margin-bottom:20px}
  .balance-card h2{font-size:14px;opacity:0.9}
  .balance-card h1{font-size:32px;margin:10px 0}
  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
  .action-btn{background:#2a2a2a;border:none;color:#fff;padding:15px;border-radius:15px;cursor:pointer}
  .action-btn:hover{background:#333}
  .pin-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0f0f;display:flex;align-items:center;justify-content:center;z-index:100}
  .pin-box{background:#1a1a1a;padding:30px;border-radius:20px;text-align:center;width:90%;max-width:350px}
  .pin-dots{display:flex;gap:10px;justify-content:center;margin:20px 0}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid #ff6a00}
  .dot.filled{background:#ff6a00}
  .numpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .num-btn{background:#2a2a2a;border:none;color:#fff;font-size:20px;padding:20px;border-radius:15px;cursor:pointer}
  .receipt{background:#fff;color:#000;padding:20px;border-radius:15px;margin-top:20px;display:none}
  .btn-primary{background:#ff6a00;color:#fff;border:none;padding:12px 20px;border-radius:10px;width:100%;cursor:pointer;font-weight:700;margin-top:10px}
</style>
</head>
<body>

<!-- PIN SCREEN - Lesson 11 -->
<div id="pinScreen" class="pin-screen">
  <div class="pin-box">
    <h2>Enter KellyBank PIN</h2>
    <div class="pin-dots" id="pinDots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="numpad">
      <button class="num-btn" onclick="enterPin('1')">1</button>
      <button class="num-btn" onclick="enterPin('2')">2</button>
      <button class="num-btn" onclick="enterPin('3')">3</button>
      <button class="num-btn" onclick="enterPin('4')">4</button>
      <button class="num-btn" onclick="enterPin('5')">5</button>
      <button class="num-btn" onclick="enterPin('6')">6</button>
      <button class="num-btn" onclick="enterPin('7')">7</button>
      <button class="num-btn" onclick="enterPin('8')">8</button>
      <button class="num-btn" onclick="enterPin('9')">9</button>
      <button class="num-btn" onclick="clearPin()">C</button>
      <button class="num-btn" onclick="enterPin('0')">0</button>
      <button class="num-btn" onclick="submitPin()">✓</button>
    </div>
    <p style="margin-top:15px;font-size:12px;color:#888">Default PIN: 1234</p>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo">K</div>
      <div><h3>KellyBank</h3><small style="color:#888">CEO Account</small></div>
    </div>
    <button onclick="lockApp()" style="background:none;border:none;color:#fff">🔒</button>
  </div>

  <div class="balance-card">
    <h2>Available Balance</h2>
    <h1 id="balance">₦250,000.00</h1>
    <small id="acctNo">KellyBank • 9012 3456 7890</small>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="showTransfer()">💸<br>Transfer</button>
    <button class="action-btn" onclick="shareApp()">📤<br>Share</button>
    <button class="action-btn" onclick="showReceipt()">🧾<br>Receipt</button>
  </div>

  <!-- Transfer -->
  <div id="transferBox" style="display:none;background:#2a2a2a;padding:15px;border-radius:15px">
    <h4>Send Money</h4>
    <input id="sendTo" placeholder="Account Number" style="width:100%;padding:10px;border-radius:8px;border:none;margin:10px 0">
    <input id="sendAmount" type="number" placeholder="Amount" style="width:100%;padding:10px;border-radius:8px;border:none">
    <button class="btn-primary" onclick="doTransfer()">Send Now</button>
  </div>

  <!-- Receipt with Share - Lesson 11 -->
  <div id="receipt" class="receipt">
    <h3 style="text-align:center">KellyBank Receipt</h3>
    <hr style="margin:10px 0">
    <p>From: KellyBank 9012 3456 7890</p>
    <p id="rTo">To: -</p>
    <p id="rAmount">Amount: -</p>
    <p id="rDate">Date: -</p>
    <p style="margin-top:10px;color:green;font-weight:bold">Status: SUCCESS</p>
    <button class="btn-primary" onclick="shareReceipt()">Share Receipt 📤</button>
  </div>
</div>

<script>
// PWA
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }

// PIN LOGIC - Lesson 11
let pinInput = "";
let savedPin = localStorage.getItem("kelly_pin") || "1234";
let isLogged = false;

function enterPin(n){
  if(pinInput.length < 4){ pinInput += n; updateDots(); }
}
function clearPin(){ pinInput=""; updateDots(); }
function updateDots(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('filled', i < pinInput.length);
  });
}
function submitPin(){
  if(pinInput === savedPin){
    document.getElementById('pinScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    pinInput=""; updateDots();
  } else {
    alert("Wrong PIN! Try 1234"); clearPin();
  }
}
function lockApp(){
  document.getElementById('pinScreen').style.display='flex';
  document.getElementById('mainApp').style.display='none';
}

// Balance
let balance = parseFloat(localStorage.getItem("kelly_balance") || "250000");
document.getElementById('balance').innerText = "₦" + balance.toLocaleString() + ".00";

function showTransfer(){ document.getElementById('transferBox').style.display='block'; }

function doTransfer(){
  let to = document.getElementById('sendTo').value;
  let amt = parseFloat(document.getElementById('sendAmount').value);
  if(!to || !amt){ alert("Fill all"); return; }
  if(amt > balance){ alert("Insufficient"); return; }
  balance -= amt;
  localStorage.setItem("kelly_balance", balance);
  document.getElementById('balance').innerText = "₦" + balance.toLocaleString() + ".00";
  
  // Fill receipt
  document.getElementById('rTo').innerText = "To: " + to;
  document.getElementById('rAmount').innerText = "Amount: ₦" + amt.toLocaleString();
  document.getElementById('rDate').innerText = "Date: " + new Date().toLocaleString();
  document.getElementById('receipt').style.display='block';
  document.getElementById('transferBox').style.display='none';
}

function showReceipt(){ document.getElementById('receipt').style.display='block'; }

// SHARE - Lesson 11
async function shareApp(){
  if(navigator.share){
    await navigator.share({title:'KellyBank', text:'Use KellyBank for fast transfers', url: window.location.href});
  } else {
    alert("Link copied: " + window.location.href);
  }
}
async function shareReceipt(){
  let text = document.getElementById('receipt').innerText;
  if(navigator.share){
    await navigator.share({title:'KellyBank Receipt', text: text});
  } else {
    navigator.clipboard.writeText(text); alert("Receipt copied!");
  }
}
</script>
</body>
</html>
