<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelly Bank - Real Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[400px]">
  <div class="flex flex-col items-center mb-6">
    <div class="w-20 h-20 rounded-full bg-gradient-to-b from-[#FFD700] to-[#B8860B] p-[2px] mb-4">
      <div class="w-full h-full rounded-full bg-black flex items-center justify-center border-2 border-[#FFD700]">
        <div class="text-center">
          <div class="text-[#FFD700] text-2xl">🛡️</div>
          <div class="text-[7px] text-[#FFD700] font-bold tracking-widest">KELLY BANK</div>
        </div>
      </div>
    </div>
    <h1 id="title" class="text-3xl font-extrabold text-[#FFD700] tracking-wide" style="text-shadow:0 0 15px rgba(255,215,0,0.5)">Create Account</h1>
  </div>

  <!-- Tabs -->
  <div class="flex bg-[#1e1e1e] rounded-2xl p-1 mb-6">
    <button id="tabCreate" class="flex-1 py-3 rounded-xl bg-[#FFD700] text-black font-bold text-sm">Create Account</button>
    <button id="tabLogin" class="flex-1 py-3 rounded-xl text-gray-400 font-bold text-sm">Login</button>
  </div>

  <!-- Create Form -->
  <div id="createForm" class="space-y-4">
    <input id="fullName" type="text" placeholder="Full Name e.g Kelly Osaro" class="w-full px-5 py-4 rounded-2xl bg-[#1e1e1e] border border-[#2a2a2a] text-white placeholder-gray-500 outline-none focus:border-[#FFD700] transition">
    <input id="phone" type="tel" placeholder="Phone Number" class="w-full px-5 py-4 rounded-2xl bg-[#1e1e1e] border border-[#2a2a2a] text-white placeholder-gray-500 outline-none focus:border-[#FFD700] transition">
    <input id="password" type="password" placeholder="Create Password (min 6 chars)" class="w-full px-5 py-4 rounded-2xl bg-[#1e1e1e] border border-[#2a2a2a] text-white placeholder-gray-500 outline-none focus:border-[#FFD700] transition">
    <input id="confirmPassword" type="password" placeholder="Confirm Password" class="w-full px-5 py-4 rounded-2xl bg-[#1e1e1e] border border-[#2a2a2a] text-white placeholder-gray-500 outline-none focus:border-[#FFD700] transition">
    <button id="createBtn" class="w-full py-4 rounded-2xl bg-[#FFD700] text-black font-extrabold text-[15px] tracking-wide hover:bg-[#ffdf33] transition shadow-[0_0_20px_rgba(255,215,0,0.3)] mt-2">Create Account</button>
  </div>

  <!-- Login Form -->
  <div id="loginForm" class="space-y-4 hidden">
    <input id="loginPhone" type="tel" placeholder="Phone Number" class="w-full px-5 py-4 rounded-2xl bg-[#1e1e1e] border border-[#2a2a2a] text-white placeholder-gray-500 outline-none focus:border-[#FFD700] transition">
    <input id="loginPassword" type="password" placeholder="Password" class="w-full px-5 py-4 rounded-2xl bg-[#1e1e1e] border border-[#2a2a2a] text-white placeholder-gray-500 outline-none focus:border-[#FFD700] transition">
    <button id="loginBtn" class="w-full py-4 rounded-2xl bg-[#FFD700] text-black font-extrabold text-[15px] tracking-wide hover:bg-[#ffdf33] transition shadow-[0_0_20px_rgba(255,215,0,0.3)] mt-2">Login</button>
  </div>
  
  <p id="msg" class="text-center text-sm mt-4"></p>

  <div id="successBox" class="hidden mt-6 p-5 rounded-2xl bg-[#1a2e1a] border border-green-800 text-center">
    <div class="text-3xl mb-2">🎉</div>
    <h3 id="successTitle" class="font-bold text-green-400">Account Created!</h3>
    <p class="text-sm mt-2 text-gray-300">Account No: <b id="acctNo" class="text-white"></b></p>
    <p id="welcomeName" class="text-sm mt-1 text-white font-bold"></p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0YAeuE40IUmISRdARoZxaTSqm3wCzOCA",
  authDomain: "kelly-bank-36766.firebaseapp.com",
  projectId: "kelly-bank-36766",
  storageBucket: "kelly-bank-36766.firebasestorage.app",
  messagingSenderId: "1061320354015",
  appId: "1:1061320354015:web:14cd22d40103f11f80e16a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Tabs logic
const tabCreate = document.getElementById('tabCreate');
const tabLogin = document.getElementById('tabLogin');
const createForm = document.getElementById('createForm');
const loginForm = document.getElementById('loginForm');
const title = document.getElementById('title');
const msg = document.getElementById('msg');

function showCreate(){
  createForm.classList.remove('hidden'); loginForm.classList.add('hidden');
  tabCreate.className="flex-1 py-3 rounded-xl bg-[#FFD700] text-black font-bold text-sm";
  tabLogin.className="flex-1 py-3 rounded-xl text-gray-400 font-bold text-sm";
  title.innerText="Create Account"; msg.innerText=""; document.getElementById('successBox').classList.add('hidden');
}
function showLogin(){
  loginForm.classList.remove('hidden'); createForm.classList.add('hidden');
  tabLogin.className="flex-1 py-3 rounded-xl bg-[#FFD700] text-black font-bold text-sm";
  tabCreate.className="flex-1 py-3 rounded-xl text-gray-400 font-bold text-sm";
  title.innerText="Welcome Back"; msg.innerText=""; document.getElementById('successBox').classList.add('hidden');
}
tabCreate.onclick=showCreate; tabLogin.onclick=showLogin;

// CREATE ACCOUNT
document.getElementById('createBtn').addEventListener('click', async () => {
  const fullName = document.getElementById('fullName').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('createBtn');

  if(!fullName || !phone || !password || !confirm){ msg.innerText="⚠️ Fill all fields"; msg.className="text-center text-sm mt-4 text-red-400"; return; }
  if(password.length < 6){ msg.innerText="⚠️ Password min 6 chars"; msg.className="text-center text-sm mt-4 text-red-400"; return; }
  if(password !== confirm){ msg.innerText="⚠️ Passwords no match"; msg.className="text-center text-sm mt-4 text-red-400"; return; }

  btn.innerText="Creating..."; btn.disabled=true; msg.innerText="⏳ Creating..."; msg.className="text-center text-sm mt-4 text-[#FFD700]";

  try{
    const fakeEmail = phone.replace(/[^0-9]/g,'') + "@kellybank.com";
    const cred = await createUserWithEmailAndPassword(auth, fakeEmail, password);
    const accountNumber = '30' + Math.floor(10000000 + Math.random()*90000000);
    await setDoc(doc(db, "users", cred.user.uid), {
      fullName, phone, email: fakeEmail, accountNumber, balance: 0, transferPin: null, createdAt: new Date(), uid: cred.user.uid
    });
    msg.innerText=""; 
    document.getElementById('acctNo').innerText=accountNumber;
    document.getElementById('welcomeName').innerText=fullName;
    document.getElementById('successTitle').innerText="Account Created!";
    document.getElementById('successBox').classList.remove('hidden');
    btn.innerText="Account Created! ✅";
  }catch(e){ msg.innerText="❌ "+e.message; msg.className="text-center text-sm mt-4 text-red-400"; btn.innerText="Create Account"; btn.disabled=false; }
});

// LOGIN
document.getElementById('loginBtn').addEventListener('click', async () => {
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  if(!phone || !password){ msg.innerText="⚠️ Fill phone & password"; msg.className="text-center text-sm mt-4 text-red-400"; return; }
  btn.innerText="Logging in..."; btn.disabled=true; msg.innerText="⏳ Checking..."; msg.className="text-center text-sm mt-4 text-[#FFD700]";
  try{
    const fakeEmail = phone.replace(/[^0-9]/g,'') + "@kellybank.com";
    const cred = await signInWithEmailAndPassword(auth, fakeEmail, password);
    const snap = await getDoc(doc(db, "users", cred.user.uid));
    if(snap.exists()){
      const data = snap.data();
      msg.innerText="";
      document.getElementById('acctNo').innerText=data.accountNumber;
      document.getElementById('welcomeName').innerText="Welcome "+data.fullName+" - Balance ₦"+data.balance;
      document.getElementById('successTitle').innerText="Login Success!";
      document.getElementById('successBox').classList.remove('hidden');
      btn.innerText="Logged In! ✅";
    }
  }catch(e){ msg.innerText="❌ Wrong phone or password"; msg.className="text-center text-sm mt-4 text-red-400"; btn.innerText="Login"; btn.disabled=false; }
});
</script>
</body>
</html>
