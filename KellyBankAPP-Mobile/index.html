<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelly Bank - Real Bank</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
<div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl">
<h1 class="text-3xl font-bold text-center mb-2">🏦 KELLY BANK</h1>
<p class="text-center text-slate-400 mb-6">Real Firebase - kelly-bank-36766</p>
<div id="authBox">
<input id="email" type="email" placeholder="Email" class="w-full p-3 mb-3 rounded bg-slate-700">
<input id="password" type="password" placeholder="Password" class="w-full p-3 mb-3 rounded bg-slate-700">
<input id="fullname" type="text" placeholder="Full Name" class="w-full p-3 mb-4 rounded bg-slate-700">
<div class="flex gap-3">
<button onclick="register()" class="flex-1 bg-green-600 py-3 rounded font-bold">Register</button>
<button onclick="login()" class="flex-1 bg-blue-600 py-3 rounded font-bold">Login</button>
</div>
<p id="msg" class="mt-4 text-center text-sm"></p>
</div>
<div id="dash" class="hidden">
<h2 class="text-xl font-bold mb-4">Welcome <span id="uName"></span></h2>
<p class="mb-2">Balance: <b>₦<span id="bal">0</span></b></p>
<p class="mb-4 text-sm text-slate-400">Acct: <span id="acct"></span></p>
<div class="flex gap-2 mb-4">
<input id="amount" type="number" placeholder="Amount" class="flex-1 p-2 rounded bg-slate-700">
<button onclick="deposit()" class="bg-green-600 px-4 rounded">Deposit</button>
<button onclick="withdraw()" class="bg-red-600 px-4 rounded">Withdraw</button>
</div>
<button onclick="logout()" class="w-full bg-slate-600 py-2 rounded">Logout</button>
<h3 class="mt-6 font-bold">Transactions</h3>
<div id="txs" class="mt-2 text-sm max-h-40 overflow-auto"></div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA0YAeuE40IUmISRdARoZxaTSqm3wCzOCA",
  authDomain: "kelly-bank-36766.firebaseapp.com",
  projectId: "kelly-bank-36766",
  storageBucket: "kelly-bank-36766.firebasestorage.app",
  messagingSenderId: "1061320354015",
  appId: "1:1061320354015:web:14cd22d40103f11f80e16a",
  measurementId: "G-33G78WM19N"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window.register = async () => {
 const email = document.getElementById('email').value;
 const pass = document.getElementById('password').value;
 const name = document.getElementById('fullname').value;
 if(!email||!pass||!name){document.getElementById('msg').innerText='Fill all fields';return;}
 try{
  const cred = await createUserWithEmailAndPassword(auth,email,pass);
  const acctNo = '30'+Math.floor(10000000+Math.random()*90000000);
  await setDoc(doc(db,"users",cred.user.uid),{fullName:name,email:email,accountNumber:acctNo,balance:0,createdAt:new Date()});
  document.getElementById('msg').innerText='Registered!';
 }catch(e){document.getElementById('msg').innerText=e.message}
}
window.login = async () => {
 try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);}catch(e){document.getElementById('msg').innerText=e.message}
}
window.logout = async () => { await signOut(auth); }
window.deposit = async () => {
 const amt=parseFloat(document.getElementById('amount').value);
 if(!amt)return;
 const ref=doc(db,"users",auth.currentUser.uid);
 const snap=await getDoc(ref);
 const newBal=(snap.data().balance||0)+amt;
 await updateDoc(ref,{balance:newBal});
 await addDoc(collection(db,"users",auth.currentUser.uid,"transactions"),{type:'deposit',amount:amt,balance:newBal,date:new Date()});
}
window.withdraw = async () => {
 const amt=parseFloat(document.getElementById('amount').value);
 if(!amt)return;
 const ref=doc(db,"users",auth.currentUser.uid);
 const snap=await getDoc(ref);
 if(snap.data().balance<amt){alert('Insufficient');return;}
 const newBal=snap.data().balance-amt;
 await updateDoc(ref,{balance:newBal});
 await addDoc(collection(db,"users",auth.currentUser.uid,"transactions"),{type:'withdraw',amount:amt,balance:newBal,date:new Date()});
}
onAuthStateChanged(auth, async (user)=>{
 if(user){
  document.getElementById('authBox').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
   const d=snap.data();
   document.getElementById('uName').innerText=d.fullName;
   document.getElementById('bal').innerText=d.balance;
   document.getElementById('acct').innerText=d.accountNumber;
  }
  const q=query(collection(db,"users",user.uid,"transactions"),orderBy("date","desc"));
  onSnapshot(q,(qs)=>{
   let html='';
   qs.forEach(doc=>{const t=doc.data(); html+=`<div>${t.type} ₦${t.amount} - Bal ₦${t.balance}</div>`});
   document.getElementById('txs').innerHTML=html;
  });
 }else{
  document.getElementById('authBox').classList.remove('hidden');
  document.getElementById('dash').classList.add('hidden');
 }
});
</script>
</body>
</html>
