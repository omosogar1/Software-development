<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KellyBankApp</title><link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;margin:0;background:#eef1f8}
.header{background:#1a237e;color:white;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;background:#ffcc55;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1a237e;font-size:22px}
.balance{background:linear-gradient(135deg,#1a237e,#283593);color:white;margin:16px;border-radius:16px;padding:20px}
.bal-amt{font-size:28px;font-weight:800;margin:8px 0}
.btns{display:flex;gap:10px;padding:0 16px}
.btn{flex:1;background:#ffcc55;border:none;padding:14px;border-radius:12px;font-weight:800}
.history{background:white;margin:16px;border-radius:16px;padding:16px;min-height:200px}
</style>
</head>
<body>
<div class="header"><div class="logo">K</div><b>KellyBankApp</b></div>
<div class="balance"><small>Available Balance</small><div class="bal-amt">$5,500.00</div><small>Account: 2020 (Kelly) | Port Harcourt</small></div>
<div class="btns"><button class="btn">Deposit</button><button class="btn">Withdraw</button><button class="btn">Transfer</button></div>
<div class="history"><b>Transaction History</b><p style="color:#888">No transactions yet</p></div>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body>
</html>
